{% extends "base.html" %}
{% block content %}
<h2>تغيير كلمة المرور</h2>
{% if g.user['must_change'] %}<div class="flash err">يجب تغيير كلمة المرور الافتراضية قبل المتابعة.</div>{% endif %}
<div class="card" style="max-width:420px">
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>كلمة المرور الحالية</label><input type="password" name="current" required style="width:100%">
    <label style="margin-top:10px">كلمة المرور الجديدة (6 أحرف على الأقل)</label><input type="password" name="new" required style="width:100%">
    <label style="margin-top:10px">تأكيد كلمة المرور</label><input type="password" name="new2" required style="width:100%">
    <button class="btn" style="margin-top:14px">حفظ</button>
  </form>
</div>
{% endblock %}
