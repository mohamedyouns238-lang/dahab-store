{% extends "base.html" %}
{% block title %}تسجيل الدخول{% endblock %}
{% block guest %}
<div class="login-bg"><div class="login">
  <div class="card">
    <div class="brand-name">{{ STORE_NAME }}</div>
    <div class="orn">❖ ✦ ❖</div>
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <label>اسم المستخدم</label>
      <input name="username" style="width:100%" autofocus required autocomplete="username">
      <label style="margin-top:10px">كلمة المرور</label>
      <input name="password" type="password" style="width:100%" required autocomplete="current-password">
      <button class="btn lg" style="margin-top:16px">دخول</button>
    </form>
  </div>
</div></div>
{% endblock %}
